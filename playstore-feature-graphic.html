<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WitCoin - Play Store Feature Graphic (1024x500)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg1: #0e1220;
            --bg2: #1b2133;
            --accent: #2add89;
            --accent2: #00d4ff;
            --text: #eef2f7;
            --muted: #9fb0c0;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: #0d1117;
            font-family: 'Poppins', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            color: var(--text);
        }

        .wrap {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 18px;
            padding: 20px
        }

        .board {
            width: 1024px;
            height: 500px;
            background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
            box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
            position: relative;
            overflow: hidden
        }

        .controls {
            display: flex;
            gap: 12px
        }

        .btn {
            background: var(--accent);
            color: #071014;
            border: 0;
            border-radius: 10px;
            padding: 10px 14px;
            font-weight: 700;
            cursor: pointer
        }

        .btn.secondary {
            background: #1f2937;
            color: #cfe7db;
            border: 1px solid #2b3b4f
        }

        .note {
            font-size: 12px;
            color: #a8b3c2
        }

        .credit {
            font-size: 12px;
            color: #7e8da1;
            margin-top: -8px
        }

        /* Position helper for preview watermark */
        .watermark {
            position: absolute;
            right: 18px;
            bottom: 16px;
            font-size: 12px;
            letter-spacing: .1em;
            color: #8aa;
            opacity: .6
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="board">
            <!-- Scalable vector graphic at exact 1024x500 -->
            <svg id="fg" xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500"
                preserveAspectRatio="xMidYMid slice">
                <defs>
                    <linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#0e1220" />
                        <stop offset="100%" stop-color="#1b2133" />
                    </linearGradient>
                    <linearGradient id="g-accent" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#2add89" />
                        <stop offset="100%" stop-color="#00d4ff" />
                    </linearGradient>
                    <linearGradient id="g-title" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#2add89" />
                        <stop offset="100%" stop-color="#9fe9d0" />
                    </linearGradient>
                    <filter id="blur-strong" x="-30%" y="-30%" width="160%" height="160%">
                        <feGaussianBlur stdDeviation="50" />
                    </filter>
                    <filter id="blur-soft" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="20" />
                    </filter>
                    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"
                        patternTransform="translate(0,0)">
                        <circle cx="1" cy="1" r="1" fill="#2a3347" />
                    </pattern>
                </defs>
                <!-- Background -->
                <rect width="1024" height="500" fill="url(#g-bg)" />
                <rect width="1024" height="500" fill="url(#grid)" opacity=".35" />
                <!-- Abstract glow shapes -->
                <circle cx="860" cy="-40" r="200" fill="#2add89" opacity=".25" filter="url(#blur-strong)" />
                <circle cx="990" cy="340" r="170" fill="#00d4ff" opacity=".22" filter="url(#blur-strong)" />
                <circle cx="120" cy="420" r="140" fill="#2add89" opacity=".18" filter="url(#blur-soft)" />
                <!-- Accent diagonal ribbons -->
                <path d="M760 0 L1024 0 L1024 210 L740 330 Z" fill="url(#g-accent)" opacity=".12" />
                <path d="M0 360 L420 200 L520 240 L0 500 Z" fill="url(#g-accent)" opacity=".08" />
                <!-- Mining composition with real assets (polished) -->
                <g id="mining-composition" transform="translate(595,30)">
                    <!-- soft background glow -->
                    <g opacity="0.22">
                        <circle cx="250" cy="180" r="200" fill="#2add89" filter="url(#blur-strong)" />
                        <circle cx="260" cy="200" r="160" fill="#00d4ff" filter="url(#blur-soft)" />
                    </g>
                    <!-- Coin frame -->
                    <g>
                        <circle cx="250" cy="180" r="120" fill="#0d1526" stroke="#142238" stroke-width="2" />
                        <circle cx="250" cy="180" r="120" fill="none" stroke="url(#g-accent)" stroke-width="8"
                            opacity="0.8" />
                        <circle cx="250" cy="180" r="98" fill="#0b1220" />
                    </g>
                    <!-- Wit logo inside coin -->
                    <image href="images/witshell-logo.png" x="180" y="110" width="140" height="140" opacity="0.75"
                        preserveAspectRatio="xMidYMid meet" />
                    <!-- Hammer icon striking the rim -->
                    <g transform="translate(200,80) rotate(0)">
                        <!-- fallback vector handle if image missing -->
                        <!-- <rect x="-6" y="40" width="12" height="120" rx="8" fill="#24334b" opacity="0.7" /> -->
                        <image href="images/hammer-icon.png" width="70" height="70" opacity="0.96" />
                    </g>
                </g>
                <!-- Copy block (left) -->
                <g transform="translate(70,110)">
                    <text x="0" y="0" font-size="88" font-weight="800" fill="url(#g-title)">WitCoin</text>
                    <text x="0" y="56" font-size="26" font-weight="600" fill="#98ffd6" opacity=".95">Digital Reward
                        Token</text>
                    <text x="0" y="118" font-size="36" font-weight="700" fill="#e8f6ff">Mine. Learn. Earn.</text>
                    <text x="0" y="160" font-size="22" font-weight="600" fill="#c3d5e3" opacity=".95">Cloud Mining •
                        Quizzes • Referrals</text>
                </g>
            </svg>
        </div>
        <div class="controls">
            <button class="btn" onclick="downloadPNG()">Download PNG (1024×500)</button>
            <button class="btn secondary" onclick="downloadSVG()">Download SVG</button>
        </div>
        <div class="note">Tip: Open this file in your browser, tweak copy if needed, then export a crisp PNG for Play
            Store.</div>
        <div class="credit">Designed for WitShells • Colors aligned with site accent</div>
    </div>
    <script>
        function downloadSVG() {
            const svg = document.getElementById('fg');
            const data = new XMLSerializer().serializeToString(svg);
            const blob = new Blob([data], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'witcoin-feature-1024x500.svg'; a.click();
            setTimeout(() => URL.revokeObjectURL(url), 2500);
        }
        function downloadPNG() {
            const svg = document.getElementById('fg');
            const data = new XMLSerializer().serializeToString(svg);
            const svgBlob = new Blob([data], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(svgBlob);
            const img = new Image();
            img.onload = function () {
                const canvas = document.createElement('canvas');
                canvas.width = 1024; canvas.height = 500;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#0e1220';
                ctx.fillRect(0, 0, 1024, 500);
                ctx.drawImage(img, 0, 0);
                URL.revokeObjectURL(url);
                canvas.toBlob(function (blob) {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'witcoin-feature-1024x500.png';
                    a.click();
                    setTimeout(() => URL.revokeObjectURL(a.href), 2500);
                }, 'image/png');
            };
            img.src = url;
        }
    </script>
</body>

</html>
